name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest -q

  integration-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run cross-layer integration tests
        run: >
          uv run --locked pytest -q
          tests/test_main.py
          tests/test_handlers.py
          tests/test_router.py
          tests/test_confirmation_queue.py
          tests/test_context_builder.py
          tests/test_context_editor_auth.py
          tests/test_context_editor_server.py

      - name: Set up Node for browser checks
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/context-editor-browser" --no-save --package-lock=false playwright@1.63.0
          "$RUNNER_TEMP/context-editor-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Exercise editor with the real API
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/context-editor-browser/node_modules/playwright
        run: node scripts/test_context_editor_browser.cjs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - unit-test
      - integration-test
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - name: Deploy to Lightsail over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            cd /opt/david
            git fetch origin main
            git reset --hard origin/main
            uv sync --locked
            # Bootstrap-only: install units if this is a fresh server.
            if [ ! -f /etc/systemd/system/david.service ]; then
              sudo /opt/david/ops/david/install_lightsail_systemd.sh
              sudo systemctl daemon-reload
            fi

            sudo systemctl restart david.service
            sudo systemctl start david-backup.timer
            for i in {1..12}; do
              if sudo systemctl is-active --quiet david.service; then
                echo "david.service is active"
                exit 0
              fi
              echo "waiting for david.service to become active ($i/12)"
              sleep 5
            done

            echo "david.service failed to stabilize"
            sudo systemctl status david.service --no-pager -l || true
            sudo journalctl -u david.service -n 200 --no-pager || true
            exit 1
