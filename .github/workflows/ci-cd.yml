name: CI/CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync

      - name: Run cross-layer integration tests
        run: >
          uv run pytest -q
          tests/test_main.py
          tests/test_handlers.py
          tests/test_router.py
          tests/test_confirmation_queue.py
          tests/test_context_builder.py

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - unit-test
      - integration-test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lightsail over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            cd /opt/david
            git fetch origin main
            git reset --hard origin/main
            uv sync
            # Bootstrap-only: install units if this is a fresh server.
            if [ ! -f /etc/systemd/system/david.service ]; then
              sudo /opt/david/ops/david/install_lightsail_systemd.sh
              sudo systemctl daemon-reload
            fi

            sudo systemctl restart david.service
            sudo systemctl start david-backup.timer
            for i in {1..12}; do
              if sudo systemctl is-active --quiet david.service; then
                echo "david.service is active"
                exit 0
              fi
              echo "waiting for david.service to become active ($i/12)"
              sleep 5
            done

            echo "david.service failed to stabilize"
            sudo systemctl status david.service --no-pager -l || true
            sudo journalctl -u david.service -n 200 --no-pager || true
            exit 1
